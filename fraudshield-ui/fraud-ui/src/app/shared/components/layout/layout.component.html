<!-- Mobile overlay -->
<div class="mobile-overlay" *ngIf="mobileOpen()" (click)="closeMobile()"></div>

<div class="app-shell">
  <!-- ── Sidebar ─────────────────────────────── -->
  <aside class="sidebar" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
      <div class="brand-text" *ngIf="!collapsed()">
        <span class="brand-name">FraudShield</span>
        <span class="brand-version">v2.0</span>
      </div>
    </div>

    <!-- Nav label -->
    <div class="nav-section-label" *ngIf="!collapsed()">NAVIGATION</div>

    <!-- Nav items -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [pTooltip]="collapsed() ? item.label : ''"
        tooltipPosition="right"
        (click)="closeMobile()">
        <span class="nav-icon"><i [class]="item.icon"></i></span>
        <span class="nav-label" *ngIf="!collapsed()">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !collapsed()">{{ item.badge }}</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="sidebar-bottom">
      <div class="nav-section-label" *ngIf="!collapsed()">ACCOUNT</div>
      <button class="nav-item logout-item" (click)="logout()"
        [pTooltip]="collapsed() ? 'Logout' : ''" tooltipPosition="right">
        <span class="nav-icon"><i class="fas fa-arrow-right-from-bracket"></i></span>
        <span class="nav-label" *ngIf="!collapsed()">Logout</span>
      </button>

      <div class="sidebar-user" *ngIf="!collapsed()">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <div class="user-name">Admin User</div>
          <div class="user-role">Fraud Analyst</div>
        </div>
      </div>
    </div>

    <!-- Collapse toggle (desktop only) -->
    <button class="collapse-btn" (click)="toggleSidebar()">
      <i class="fas" [ngClass]="collapsed() ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>
  </aside>

  <!-- ── Main area ──────────────────────────── -->
  <div class="main-area">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <!-- Mobile hamburger -->
        <button class="mobile-menu-btn" (click)="toggleMobile()">
          <i class="fas fa-bars"></i>
        </button>
        <!-- Breadcrumb / page title -->
        <div class="topbar-breadcrumb">
          <i class="fas fa-shield-halved topbar-logo-icon"></i>
          <span class="topbar-brand">FraudShield</span>
          <span class="topbar-sep">/</span>
          <span class="topbar-page">Dashboard</span>
        </div>
      </div>

      <div class="topbar-center">
        <div class="topbar-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search transactions, merchants..." />
          <kbd>Ctrl+K</kbd>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Alert badge -->
        <button class="topbar-btn" (click)="alertPanel.toggle($event)">
          <i class="fas fa-bell"></i>
          <span class="topbar-badge">4</span>
        </button>

        <!-- Status indicator -->
        <div class="topbar-status">
          <span class="status-dot"></span>
          <span class="status-text">Live</span>
        </div>

        <!-- Avatar -->
        <div class="topbar-avatar" (click)="userPanel.toggle($event)">
          AD
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
    </header>

    <!-- Notification panel -->
    <p-overlayPanel #alertPanel>
      <div class="notif-panel">
        <div class="notif-header">
          <span>Notifications</span>
          <span class="notif-count">{{ alerts.length }} new</span>
        </div>
        <div class="notif-list">
          <div class="notif-item" *ngFor="let a of alerts" [class]="'notif-' + a.type">
            <div class="notif-icon-wrap" [class]="'notif-icon-' + a.type">
              <i class="fas" [ngClass]="alertIcon(a.type)"></i>
            </div>
            <div class="notif-body">
              <div class="notif-title">{{ a.title }}</div>
              <div class="notif-msg">{{ a.msg }}</div>
              <div class="notif-time">{{ a.time }}</div>
            </div>
          </div>
        </div>
        <div class="notif-footer">View all notifications</div>
      </div>
    </p-overlayPanel>

    <!-- User panel -->
    <p-overlayPanel #userPanel>
      <div class="user-panel">
        <div class="user-panel-info">
          <div class="up-avatar">AD</div>
          <div>
            <div class="up-name">Admin User</div>
            <div class="up-email">admin&#64;fraudshield.com</div>
          </div>
        </div>
        <div class="up-divider"></div>
        <button class="up-item"><i class="fas fa-user"></i> Profile</button>
        <button class="up-item"><i class="fas fa-gear"></i> Settings</button>
        <button class="up-item danger" (click)="logout()"><i class="fas fa-arrow-right-from-bracket"></i> Logout</button>
      </div>
    </p-overlayPanel>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
