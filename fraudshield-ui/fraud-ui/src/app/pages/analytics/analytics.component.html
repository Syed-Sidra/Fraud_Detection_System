<div class="page-wrapper">
  <div class="page-header fade-in-up">
    <div>
      <h1 class="page-title">Fraud Analytics</h1>
      <p class="page-sub">Deep-dive into fraud patterns, trends, and risk distribution across time and categories</p>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-row-4">
    <div class="kpi-card fade-in-up" *ngFor="let k of kpis; let i = index" [ngClass]="'d' + (i+1)">
      <div class="kpi-icon" [ngClass]="k.color"><i [class]="k.icon"></i></div>
      <div>
        <div class="kpi-value">{{ k.value }}</div>
        <div class="kpi-label">{{ k.label }}</div>
        <div class="kpi-sub" [class.up-text]="k.up" [class.neutral-text]="!k.up">{{ k.change }}</div>
      </div>
    </div>
  </div>

  <!-- Trend chart -->
  <div class="chart-card fade-in-up d2" style="margin-bottom:16px">
    <div class="chart-card-header">
      <div class="chart-card-title"><i class="fas fa-chart-area"></i> Risk Level Trend — Dec 20–31</div>
    </div>
    <div style="height:260px">
      <p-chart type="line" [data]="trendData" [options]="trendOpts" height="260"></p-chart>
    </div>
  </div>

  <!-- Bottom charts grid -->
  <div class="analytics-grid">
    <div class="chart-card fade-in-up d3">
      <div class="chart-card-header"><div class="chart-card-title"><i class="fas fa-chart-pie"></i> Fraud by Category (Doughnut)</div></div>
      <div style="height:260px"><p-chart type="doughnut" [data]="pieData" [options]="pieOpts" height="260"></p-chart></div>
    </div>
    <div class="chart-card fade-in-up d4">
      <div class="chart-card-header"><div class="chart-card-title"><i class="fas fa-spider"></i> Weekly Risk Pattern (Radar)</div></div>
      <div style="height:260px"><p-chart type="radar" [data]="radarData" [options]="radarOpts" height="260"></p-chart></div>
    </div>
    <div class="chart-card fade-in-up d5">
      <div class="chart-card-header"><div class="chart-card-title"><i class="fas fa-chart-scatter"></i> Category Distribution (Polar)</div></div>
      <div style="height:260px"><p-chart type="polarArea" [data]="polarData" [options]="polarOpts" height="260"></p-chart></div>
    </div>
  </div>
</div>
